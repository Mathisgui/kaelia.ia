raison: >-
  Requêtes à portée sur 28 jours (rapport 2026-S46-donnees), toutes sur la page anglaise :
  « what's the difference between an ai agent and a marketing workflow automation? »
  10 impressions, 0 clic, position 8,4 ; « ai agent automation » 45 impressions, position
  14,6 ; « automation ai agents » 29, position 15,2 ; « ai automation agent » 27, position
  15,7. La page anglaise est la plus vue du site (503 impressions, 1 clic, position 22,4) et
  aucune section ne pose la question marketing telle qu'elle est tapée. Titre anglais changé
  le 2026-10-27 (action 2026-S43-01) : il ne se rechange pas avant 60 jours, seule une section
  s'ajoute. Dernière modification il y a plus de 14 jours.
changes:
  - champ: section
    h2: "Agent IA ou automatisation marketing : quelle différence ?"
    placement: "nouvelle section, juste avant la section dont le titre commence par « Le système combiné »"
