terrainCaseId: null
terrainNote: >-
  Aucun cas artisan réel chez Kael'IA : ne pas employer l'encadré Terrain, qui
  affirme une expérience vécue et porte la signature de Mathis. Employer
  l'encadré Scenario, annoncé comme un exemple, sur une situation ordinaire du
  métier : une entreprise de couverture de trois salariés qui sort une trentaine
  de devis par mois et les prépare le soir. Aucun chiffre de résultat dans cet
  encadré : les seuls chiffres de l'article sont ceux des sources.
