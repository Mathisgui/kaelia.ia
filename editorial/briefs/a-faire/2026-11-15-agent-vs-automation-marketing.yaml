      - "un tableau à deux colonnes (automatisation marketing, agent IA) et quatre lignes : ce qui la déclenche, le contenu qu'elle traite, ce qu'elle produit, ce qui se passe face à un cas imprévu. Reprendre uniquement des idées déjà présentes dans l'article (exemple du formulaire, déterministe, limitée au prévu, interprétation du texte libre), sans aucun chiffre nouveau"
      - "une phrase qui renvoie à la section suivante sur le système combiné, sans répéter son contenu"
    en:
      h2: "What's the difference between an AI agent and a marketing workflow automation?"
      placement: "même placement, juste avant « The combined system: the agent decides, the workflow executes »"
      note: "même section en anglais, même tableau ; le titre de section reprend la requête telle qu'elle est tapée"
