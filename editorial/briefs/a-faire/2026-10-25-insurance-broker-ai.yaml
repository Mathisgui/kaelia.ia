terrainCaseId: cas-03
terrainNote: >-
  cas-03 (courtier en assurance indépendant, Lyon), validé le 2026-09-22. N'en reprendre que
  ce que dit cas-anonymises.md : double stockage, rappels manuels et notes papier, tableur
  bricolé, espace de travail unique, assistants pour les demandes de pièces, les documents de
  conformité et la préparation des rendez-vous, une étape restée manuelle et annoncée avant
  la vente. Ne nommer ni le réseau, ni ses outils, ni aucun logiciel.
crossSite: >-
  Vérifié le 2026-10-25 dans les deux cartes : aucune entrée Kael'IA ne vise l'assurance ou
  le courtage ; côté Kaelia, aucune non plus (financement et portage). Ne pas glisser vers
  « se former à l'IA quand on est courtier », terrain de Kaelia et des pages en tête.
