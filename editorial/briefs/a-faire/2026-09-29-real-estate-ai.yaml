    date: "2026-09-22"
    verified: "Citations exactes disponibles : « Le nombre de TPE PME qui ont indiqué avoir recours à des solutions d'intelligence artificielle a doublé en un an, et atteint 26 % » ; « Les usages sont dominés par l'intelligence artificielle générative (22%, + 12 points) et les chatbots et assistants (14%, + 9 points) » ; « Les solutions permettant l'analyse de documents (6%, + 3 points), l'automatisation de tâches (5%, + 2 points), ou l'analyse des données (5%, + 2 points), restent moins répandues »."
    attention: "ATTENTION : cette page ne donne AUCUN chiffre pour le secteur immobilier. Ne pas en inventer un, ne pas extrapoler depuis un autre secteur. Utiliser les chiffres tous secteurs confondus, en le disant."
